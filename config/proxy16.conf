# windows-proxy-pool - proxy16 - 127.0.0.1:8016
# Generated by scripts\generate.ps1 from credentials.txt - DO NOT EDIT MANUALLY.
# Re-run generate.ps1 after changing credentials or moving this project folder.

# --- Authentication: Basic Auth (username/password) ---
auth strong
users $"C:\FAI\proxy\config\proxy16.users"
allow *
deny *

# --- Logging (per-instance log file, daily rotation by default) ---
# Rotation interval (D): "" = single stable file, D = daily,
# H = hourly, W = weekly, M = monthly, Y = annually.
log "C:\FAI\proxy\logs\proxy16.log" D
logformat "- +_L%t.%.  %N.%p %E %U %C:%c %R:%r %O %I %h %T"

# --- Runtime ---
pidfile "C:\FAI\proxy\run\proxy16.pid"

# --- HTTP proxy service ---
# -i 127.0.0.1   : listen on loopback interface ONLY
# -p 8016          : listen port
# -olSO_EXCLUSIVEADDRUSE : Windows: prevent another process from binding this port
proxy -p8016 -i127.0.0.1 -olSO_EXCLUSIVEADDRUSE
